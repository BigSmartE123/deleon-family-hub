<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>DeLeon Family Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#233044;font:16px Arial,sans-serif}header{background:#24364d;color:white;padding:15px 20px;overflow:hidden}h1{font-size:25px;margin:0}header small{color:#c6d5e6}#clock{float:right;font-size:25px;font-weight:bold}.wrap{padding:12px;max-width:1100px;margin:auto}.top{margin-bottom:10px}.btn{border:0;background:#fff;color:#24364d;border-radius:7px;padding:9px 14px;font-size:16px;margin-right:5px;cursor:pointer}.btn:active{background:#d8e9fa}.columns{display:table;width:100%;border-spacing:10px 0;table-layout:fixed}.main,.side{display:table-cell;vertical-align:top}.main{width:68%}.side{width:32%}.panel{background:#fff;border-radius:10px;padding:13px;margin-bottom:12px;box-shadow:0 2px 5px rgba(20,30,50,.08)}h2{margin:0 0 10px;font-size:19px}.calendar{width:100%;border-collapse:collapse;table-layout:fixed}.calendar th{font-size:12px;color:#6d7d91;padding:8px 0}.calendar td{border:1px solid #e4eaf1;height:65px;vertical-align:top;padding:5px;font-size:14px;cursor:pointer}.calendar td:active{background:#e8f2fc}.calendar .today{background:#e7f2ff}.calendar .selected{outline:2px solid #346fba;outline-offset:-2px}.calendar .muted{color:#b6bdc7}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:3px 2px 0 0}.blue{background:#4184d7}.purple{background:#9b6acb}.orange{background:#e6a23c}.green{background:#45a685}.item{border-left:4px solid #4184d7;padding:8px 9px;background:#f6f8fb;margin:7px 0;border-radius:4px;font-size:14px}.item.purple-border{border-color:#9b6acb}.item.orange-border{border-color:#e6a23c}.item.green-border{border-color:#45a685}.mutedtext{color:#66758b;font-size:13px}.task{padding:10px 0;border-bottom:1px solid #edf0f4;font-size:14px}.task input{width:19px;height:19px;vertical-align:middle;margin-right:8px}.legend{font-size:12px;margin:7px 0}.legend span{margin-right:10px;white-space:nowrap}#status{font-size:12px;color:#65768d;margin-top:8px}#dateLabel{display:inline-block;font-weight:bold;margin-right:10px}@media(max-width:680px){.columns,.main,.side{display:block;width:100%}.calendar td{height:52px}.wrap{padding:6px}.panel{padding:9px}header{padding:12px}h1{font-size:20px}#clock{font-size:18px}}</style></head><body><header><div id="clock">--:--</div><h1>DeLeon Family Hub</h1><small>Our home, our schedule, our moments</small></header><div class="wrap"><div class="top"><button class="btn" onclick="changeMonth(-1)">&#9664;</button><span id="dateLabel"></span><button class="btn" onclick="changeMonth(1)">&#9654;</button><button class="btn" onclick="goToday()">Today</button></div><div class="columns"><div class="main"><div class="panel"><h2>Family Calendar</h2><div class="legend"><span><i class="dot blue"></i> Family</span><span><i class="dot purple"></i> School</span><span><i class="dot orange"></i> Church</span><span><i class="dot green"></i> Personal</span></div><table class="calendar" id="calendar"></table></div></div><div class="side"><div class="panel"><h2 id="agendaTitle">Selected Day</h2><div id="agenda"></div></div><div class="panel"><h2>Family Chores</h2><div class="task"><label><input type="checkbox">Make the bed</label></div><div class="task"><label><input type="checkbox">Tidy up living room</label></div><div class="task"><label><input type="checkbox">Prepare for tomorrow</label></div><div class="task"><label><input type="checkbox">Family prayer time</label></div></div><div class="panel"><h2>Connection</h2><div class="mutedtext">Demo mode — no Google account connected yet.</div><div id="status">Checking dashboard...</div></div></div></div></div><script>var now=new Date(),year=now.getFullYear(),month=now.getMonth(),selected=new Date(now.getFullYear(),now.getMonth(),now.getDate());var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}function changeMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}selected=new Date(year,month,1);render()}function goToday(){var d=new Date();year=d.getFullYear();month=d.getMonth();selected=new Date(year,month,d.getDate());render()}function pickDay(day){selected=new Date(year,month,day);render()}function render(){document.getElementById('dateLabel').innerHTML=monthNames[month]+' '+year;var first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();var html='<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>';var day=1;for(var r=0;r<6;r++){html+='<tr>';for(var c=0;c<7;c++){if((r===0&&c<first)||day>total){html+='<td></td>'}else{var d=new Date(year,month,day),cls=(sameDay(d,new Date())?'today ':'')+(sameDay(d,selected)?'selected':'');html+='<td class="'+cls+'" onclick="pickDay('+day+')">'+day+'<div>';if(c===0)html+='<i class="dot orange"></i>';if(c>=1&&c<=5)html+='<i class="dot purple"></i>';html+='</div></td>';day++}}html+='</tr>';if(day>total)break}document.getElementById('calendar').innerHTML=html;document.getElementById('agendaTitle').innerHTML=monthNames[selected.getMonth()]+' '+selected.getDate();var weekday=selected.getDay(),items='<div class="mutedtext">Sample events for layout testing</div>';if(weekday>=1&&weekday<=5)items+='<div class="item purple-border">School / Work Day</div>';if(weekday===0)items+='<div class="item orange-border">Church &amp; Family</div>';items+='<div class="item">Family check-in</div><div class="item green-border">Plan tomorrow</div>';document.getElementById('agenda').innerHTML=items}function tick(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),amp=h>=12?'PM':'AM';h=h%12||12;document.getElementById('clock').innerHTML=h+':'+(m<10?'0':'')+m+' '+amp}render();tick();setInterval(tick,30000);document.getElementById('status').innerHTML='Dashboard loaded successfully. Tap a date and use the arrows to test.';</script></body></html>
